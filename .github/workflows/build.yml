
name: Build Protection Companion Phase B

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Protection-Companion-PhaseB-reviewed.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify source archive
        run: test -s Protection-Companion-PhaseB-reviewed.zip

      - name: Extract Phase B project
        run: |
          unzip -q Protection-Companion-PhaseB-reviewed.zip -d _phaseb
          test -f _phaseb/protection-companion-phase-b/settings.gradle
          test -f _phaseb/protection-companion-phase-b/app/src/main/AndroidManifest.xml
          test -f _phaseb/protection-companion-phase-b/app/src/main/java/app/phasea/logger/GuardEngine.java
          test -f _phaseb/protection-companion-phase-b/app/src/main/java/app/phasea/logger/LoggerService.java

      - name: Build Phase B APK
        working-directory: _phaseb/protection-companion-phase-b
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK=_phaseb/protection-companion-phase-b/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          ls -lh "$APK"

      - name: Upload Phase B APK
        uses: actions/upload-artifact@v4
        with:
          name: protection-companion-phaseb-apk
          path: _phaseb/protection-companion-phase-b/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
