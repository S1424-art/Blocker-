name: Build Phase A Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify project files
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/app/phasea/logger/MainActivity.java
          test -f app/src/main/java/app/phasea/logger/LoggerService.java
          test -f app/src/main/java/app/phasea/logger/LogStore.java
          test -f app/src/main/res/values/strings.xml
          test -f app/src/main/res/xml/accessibility_service_config.xml

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: phasea-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
